[theme]
base = "light"
primaryColor = "#58799A"
backgroundColor = "#F7F5F2"
secondaryBackgroundColor = "#F1EEE8"
textColor = "#1F2937"
font = "sans serif"

[server]
headless = true
port = 8502
address = "localhost"

[client]
showErrorDetails = "full"
showErrorLinks = "auto"

[logger]
level = "debug"

[browser]
gatherUsageStats = false
